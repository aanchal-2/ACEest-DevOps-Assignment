events {}

http {
    resolver kube-dns.kube-system.svc.cluster.local valid=10s;

    map $http_x_ab_variant $backend {
        default aceest-variant-a-service.default.svc.cluster.local;
        "B"     aceest-variant-b-service.default.svc.cluster.local;
    }

    server {
        listen 8080;

        location / {
            proxy_pass http://$backend:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
