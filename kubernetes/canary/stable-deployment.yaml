apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-stable
  labels:
    app: aceest-canary
    version: stable
spec:
  replicas: 4
  selector:
    matchLabels:
      app: aceest-canary
      version: stable
  template:
    metadata:
      labels:
        app: aceest-canary
        version: stable
    spec:
      containers:
        - name: aceest-fitness
          image: aanchal22/aceest-fitness:v1
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
