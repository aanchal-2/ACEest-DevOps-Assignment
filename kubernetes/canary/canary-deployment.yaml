apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-canary
  labels:
    app: aceest-canary
    version: canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest-canary
      version: canary
  template:
    metadata:
      labels:
        app: aceest-canary
        version: canary
    spec:
      containers:
        - name: aceest-fitness
          image: aanchal22/aceest-fitness:v2
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
