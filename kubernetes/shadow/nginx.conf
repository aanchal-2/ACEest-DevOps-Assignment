events {}

http {
    server {
        listen 8080;

        location = /health {
            mirror /mirror;
            mirror_request_body off;

            proxy_pass http://aceest-canary-service:5000;
        }

        location = /mirror {
            internal;

            proxy_pass http://aceest-shadow-service:5000/health;
        }

        location / {
            return 404;
        }
    }
}
