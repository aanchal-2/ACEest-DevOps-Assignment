name: ACEest Fitness CI
 
on:
  push:
  pull_request:
 
permissions:
  contents: read
 
jobs:
  build-and-test:
    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
 
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
 
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
 
      - name: Build and lint
        run: |
          python -m compileall -q app.py storage.py tests
          python -m ruff check app.py storage.py tests
 
      - name: Build Docker image
        run: docker build -t aceest-fitness:ci .
 
      - name: Run Pytest inside Docker
        run: docker run --rm aceest-fitness:ci python -m pytest -v
